<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 430" width="200" height="430">
  <defs>
    <!-- ombreggiatura cilindrica del corpo -->
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#c9ccd1"/>
      <stop offset="0.28" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f1f2f4"/>
      <stop offset="1" stop-color="#aeb2b8"/>
    </linearGradient>
    <!-- ombreggiatura della spugna -->
    <linearGradient id="foam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d3d6da"/>
      <stop offset="0.3" stop-color="#f7f8f9"/>
      <stop offset="0.65" stop-color="#eceef0"/>
      <stop offset="1" stop-color="#b6bac0"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="1" stop-color="#b9bdc3"/>
    </linearGradient>
    <!-- texture spugna -->
    <pattern id="pores" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#8d9298" opacity="0.35"/>
      <circle cx="5.5" cy="5.5" r="0.7" fill="#8d9298" opacity="0.28"/>
    </pattern>
    <clipPath id="foamClip">
      <path d="M22 178 L22 46 Q22 14 56 12 Q100 8 144 12 Q178 14 178 46 L178 178 Z"/>
    </clipPath>
  </defs>

  <!-- manopola di blocco laterale -->
  <rect x="160" y="214" width="12" height="26" rx="2" fill="url(#knob)"/>
  <rect x="170" y="200" width="24" height="54" rx="5" fill="url(#knob)"/>
  <g stroke="#9aa0a7" stroke-width="1.6" opacity="0.8">
    <line x1="175" y1="203" x2="175" y2="251"/>
    <line x1="180" y1="203" x2="180" y2="251"/>
    <line x1="185" y1="203" x2="185" y2="251"/>
    <line x1="190" y1="203" x2="190" y2="251"/>
  </g>

  <!-- corpo cilindrico -->
  <path d="M30 176 L170 176 L170 410 Q170 418 162 418 L38 418 Q30 418 30 410 Z" fill="url(#body)"/>
  <!-- riflesso verticale -->
  <rect x="58" y="186" width="7" height="222" rx="3.5" fill="#ffffff" opacity="0.7"/>

  <!-- spugna antivento -->
  <path d="M22 178 L22 46 Q22 14 56 12 Q100 8 144 12 Q178 14 178 46 L178 178 Z" fill="url(#foam)"/>
  <rect x="0" y="0" width="200" height="200" fill="url(#pores)" clip-path="url(#foamClip)"/>
  <!-- bordo inferiore della spugna -->
  <path d="M22 172 L178 172 L178 180 Q100 185 22 180 Z" fill="#a9adb3" opacity="0.55"/>

  <!-- piccolo badge circolare generico (nessun logo) -->
  <circle cx="100" cy="240" r="8" fill="none" stroke="#7c828a" stroke-width="2"/>
</svg>
