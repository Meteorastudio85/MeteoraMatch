name: Build Windows

# Compila il plugin per Windows (VST3 + Standalone) a ogni push e pull request.
# Su un tag tipo v0.1.0 crea anche una bozza di Release con lo zip.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  engine-test:
    name: Test motore DSP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compila ed esegui il test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra Tests/engine_test.cpp Source/MicMatchEngine.cpp -o engine_test
          ./engine_test

  windows:
    name: Build Windows x64
    needs: engine-test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Prepara il compilatore MSVC qualunque sia la versione di Visual Studio
      # installata sul runner: cosi' non dipendiamo dal nome del generatore.
      - name: Ambiente MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-windows-ninja

      - name: Configura
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Compila
        run: cmake --build build --parallel

      - name: Impacchetta
        shell: bash
        run: |
          cd "build/MeteoraMicMatch_artefacts/${{ env.BUILD_TYPE }}"
          rm -f *.lib
          ls -la
          cmake -E tar cf "$GITHUB_WORKSPACE/MeteoraMicMatch-Windows.zip" --format=zip -- VST3 Standalone

      - name: Carica la build
        uses: actions/upload-artifact@v4
        with:
          name: MeteoraMicMatch-Windows
          path: MeteoraMicMatch-Windows.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MeteoraMicMatch-Windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: true
